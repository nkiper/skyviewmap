[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skyviewmapper"
version = "0.1.0"
description = "Map visibility of astronomical events using line-of-sight cloud cover and terrain"
requires-python = ">=3.11"
dependencies = [
    "cdsapi>=0.7.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
