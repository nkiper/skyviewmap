[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skyviewmapper"
version = "0.1.0"
description = "Map visibility of astronomical events using line-of-sight cloud cover and terrain"
requires-python = ">=3.11"
dependencies = [
    "cdsapi>=0.7.7",
    "numpy>=1.26",
    "skyfield>=1.49",
    "rasterio>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ephemeris: needs the DE440s file in data/raw/skyfield (skipped if absent)",
    "dem: needs GLO-90 tiles in data/raw/dem/glo90 (skipped if absent)",
]

# Shared by Pylance (VS Code Problems panel) and the pyright CLI.
[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
