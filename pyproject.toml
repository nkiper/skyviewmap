[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skyviewmapper"
version = "0.1.0"
description = "Map visibility of astronomical events using line-of-sight cloud cover and terrain"
requires-python = ">=3.11"
dependencies = [
    "cdsapi>=0.7.7",
    "numpy>=1.26",
    "skyfield>=1.49",
    "rasterio>=1.4",
    "xarray>=2024.1",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyright",
    "pandas-stubs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ephemeris: needs the DE440s file in data/raw/skyfield (skipped if absent)",
    "dem: needs GLO-90 tiles in data/raw/dem/glo90 (skipped if absent)",
    "era5: needs downloaded ERA5 cloud samples (skipped if absent)",
]
filterwarnings = [
    # netCDF4's Cython extension checks numpy.ndarray's size at import; a larger
    # runtime object is the backward-compatible direction. numpy silences this
    # by default, but pytest resets warning filters.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

# Shared by Pylance (VS Code Problems panel) and the pyright CLI.
[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
